services:
  frontend:
    build: ./frontend
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: .
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-zaikou}
      SPRING_DATASOURCE_USERNAME: zaikou_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Run python3 scripts/setup-local.py first}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-zaikou}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-zaikou_local}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Run python3 scripts/setup-local.py first}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  db:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zaikou}
      POSTGRES_USER: ${POSTGRES_USER:-zaikou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaikou_local}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
