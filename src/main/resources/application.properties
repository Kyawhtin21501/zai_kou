spring.application.name=zaikou
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/zaikou}
spring.datasource.username=${DATABASE_USER:zaikou}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=10
spring.flyway.clean-disabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=none
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-parameter-count=20
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
spring.servlet.multipart.enabled=false
server.tomcat.connection-timeout=20s
